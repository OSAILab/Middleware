plugins {
    id 'com.android.library'
    id 'maven-publish'
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.github.OSAILab'
            artifactId = 'MODLE'
            version = '1.0'

            afterEvaluate {
                from components.release
            }
        }
    }

}

android {
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        minSdkVersion 18
        targetSdkVersion 30
        versionCode 1
        versionName "1.1"

    }

    buildFeatures {
        buildConfig = false // 禁用 BuildConfig 生成
    }


    android.libraryVariants.all {
        variant ->
            variant.outputs.all {
                outputFileName = "osai_model.aar"
            }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}

dependencies {
}